name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: 01 lint
    runs-on: ubuntu-24.04
    steps:
      - name: wait until the step releases this commit's CI
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.pull_request.head.sha || github.sha }}/ci-release?ref=jstack-fixtures
        run: |
          until curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "$RELEASE"; do sleep 5; done
      - run: echo "lang-a sources are clean"
  tests:
    name: 02 tests
    runs-on: ubuntu-24.04
    steps:
      - name: wait until the step releases this commit's CI
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.pull_request.head.sha || github.sha }}/ci-release?ref=jstack-fixtures
        run: |
          until curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "$RELEASE"; do sleep 5; done
      - name: run the runner-a tests and the browser-a journeys
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          curl -fsSL -o bundle.json \
            "https://raw.githubusercontent.com/$REPO/jstack-fixtures/$SHA/reports.json" ||
            echo '{}' > bundle.json
          jq -r 'keys[]' bundle.json | while read -r file; do
            mkdir -p "reports/$(dirname "$file")"
            jq -r --arg f "$file" '.[$f]' bundle.json > "reports/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
  merged-dark:
    name: 03 merged-dark
    runs-on: ubuntu-24.04
    steps:
      - name: wait until the step releases this commit's CI
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.pull_request.head.sha || github.sha }}/ci-release?ref=jstack-fixtures
        run: |
          until curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "$RELEASE"; do sleep 5; done
      - name: boot and probe
        run: echo "booted with every flag building; no route of a feature in progress answers"
